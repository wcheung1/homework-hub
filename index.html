<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>功課練習樞紐</title>
<style>
  body{font-family:"PingFang TC","Microsoft JhengHei",sans-serif;margin:0;padding:24px 16px 60px;
       background:#f0f4f8;color:#23303e;line-height:1.7;}
  .wrap{max-width:860px;margin:0 auto;}
  h1{font-size:28px;color:#0066cc;margin:8px 0 4px;}
  .sub{color:#5b6b7c;font-size:15px;margin-bottom:28px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  a.card,div.card{display:block;background:#fff;border:1px solid #c9d6e2;border-radius:16px;
    padding:22px 20px;text-decoration:none;color:#23303e;
    box-shadow:0 4px 14px rgba(30,60,90,.10);transition:transform .15s,box-shadow .15s;}
  a.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(30,60,90,.18);}
  .card .icon{font-size:34px;}
  .card .t{font-size:20px;font-weight:800;margin-top:8px;}
  .card .d{font-size:14px;color:#5b6b7c;margin-top:4px;}
  .tag{display:inline-block;background:#eef8ef;color:#2f7a44;border-radius:8px;
    font-size:12px;font-weight:700;padding:2px 10px;margin-top:10px;}
  .tag.off{background:#f2f4f7;color:#8a97a6;}
  .foot{margin-top:36px;font-size:13px;color:#8ba0b5;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 功課練習樞紐</h1>
  <div class="sub">互動解題動畫 × 廣東話旁白 🎧　揀一個科目開始</div>

  <div class="grid">
    <a class="card" href="maths/">
      <div class="icon">🔢</div>
      <div class="t">數學</div>
      <div class="d">看圖列算式、解題動畫⋯</div>
      <span class="tag">✓ 有內容</span>
    </a>
    <div class="card">
      <div class="icon">📖</div>
      <div class="t">中文</div>
      <div class="d">待加入</div>
      <span class="tag off">未有內容</span>
    </div>
    <div class="card">
      <div class="icon">🔤</div>
      <div class="t">英文</div>
      <div class="d">待加入</div>
      <span class="tag off">未有內容</span>
    </div>
    <div class="card">
      <div class="icon">🔬</div>
      <div class="t">科學</div>
      <div class="d">待加入</div>
      <span class="tag off">未有內容</span>
    </div>
  </div>

  <div class="foot">
    動畫由 Three.js 驅動，需要網絡載入。<br/>
    電腦：Space 播放／暫停、→ 下一小步、← 退回　·　iPad／手機：點一下畫面播放 📱
  </div>
</div>
</body>
</html>
