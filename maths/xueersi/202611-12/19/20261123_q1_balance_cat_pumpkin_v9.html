  groupCount(actors.cats, b1L.x, b1L.y - 76, CFG.colors.halos[0], '2', 1.3);

  calcStep(0, [0, 1, 2, 3, 4], 2.4);
  /* Phase 2 拆半：掃描線 ÷2；1 貓＋上排 4 橙飛走；剩 4 橙齊現工作帶 → 寫 1貓=4橙 */
  narrStep(NARR.p2, 1, 1.4, 2);
  divStep(1.5);
  fadeFlyStep(actors.cats[1], 320, -420, 1.1, { arc: 36 });
  actors.o8.slice(0, 4).forEach(function (o, i) {
    fadeFlyStep(o, 260 + i * 30, -430, 0.95, { arc: 26 });
  });
  calcStep(1, [0, 1, 2, 3, 4], 2.4);
  /* Phase 3 睇天平②：左碟框 2 橙、右碟框 1 南瓜（組 badge） */
  narrStep(NARR.p3, 2, 1.4, 3);
  regionStep(regions.bal2, S.region);
  groupCount(actors.o2, b2L.x, b2L.y - 66, CFG.colors.halos[1], '2', 1.2);
  groupCount(actors.pumpkin2, b2R.x, b2R.y - 88, CFG.colors.halos[3], '1', 1.2);
  calcStep(2, [0, 1, 2, 3, 4], 2.4);
  /* Phase 4 v3 天平①直接代換（使用者指示 v3）：逐組做——2 橙閃示→完全消失→南瓜先至
     喺嗰組原位無中生有彈現；第二組照做 → 1貓=2南瓜
     節奏對齊旁白 p05=16.85s（A1 聲畫並行：Phase 總長 17.3s 不變） */
  narrStep(NARR.p4, 3, 1.4, 4);
  regionStep(regions.bal1, S.region);
  /* 組 1：左邊兩個橙 */
  pairPulse(actors.o8[4], actors.o8[5], 0.5, [b1R.x - 38, b1R.y - 66]);
  pairVanish(actors.o8[4], actors.o8[5], 1.0, [b1R.x - 38, b1R.y - 66]);
  pauseStep(0.35);
  popStep(actors.pk1[0], 0.8, 0.85, { fade: true });
  step(0.6, function (p) {

  pairVanish(actors.o8[6], actors.o8[7], 1.0, [b1R.x + 38, b1R.y - 66]);
  pauseStep(0.35);
  popStep(actors.pk2[0], 0.8, 0.85, { fade: true });
  step(0.7, function (p) {
    if (p <= 0) { bal1.setTilt(0); return; }
    bal1.setTilt(Math.sin(p * Math.PI) * 0.055 * (1 - p));
  });
  /* 兩個南瓜齊閃 → 組 badge 總數 → 寫 1貓=2南瓜 */
  step(1.9, function (p) {
    if (p <= 0) return;
    var k = 1 + 0.1 * Math.sin(clamp(p * 1.15, 0, 1) * Math.PI);
    actors.pk1[0].scale.setScalar(0.85 * k);
    actors.pk2[0].scale.setScalar(0.85 * k);
    pen.position.set(b1R.x, b1R.y - 60, 60);
  });
  groupCount([actors.pk1[0], actors.pk2[0]], b1R.x, b1R.y - 92, CFG.colors.halos[3], '2', 1.4);
  calcStep(3, [0, 1, 2, 3, 4], 2.6);
  step(1.5, function (p) {
    if (p <= 0) return;
    pen.position.set(b1R.x, b1R.y - 60, 60);
  });
  /* Phase 5 寫答案：2 入括號＋慶祝 */
  narrStep(NARR.p5, 4, 1.4, 5);
  ASTEPS.push({ a: 6, t0: TACC, t1: TACC + AD[6] + 0.45 });
  slotStep(0, 1.7);
  step(AD[6] + 0.45 - 1.7, function (p) {
    if (p <= 0) { celEl.el.style.opacity = 0; cheerEl.style.opacity = 0; confettiUpdate(0); return; }
    celEl.el.style.opacity = Math.min(1, p * 2.5);
    cheerEl.style.opacity = clamp((p - 0.1) * 2, 0, 1);
    confettiUpdate(p);
    NARRSTATE.text = NARR.end;
    NARRSTATE.len = Math.floor(clamp(p / 0.6, 0, 1) * (NARR.end.length + 2));
    pen.position.set(490 + Math.sin(p * 9) * 26, 862 + Math.cos(p * 7) * 10, 60);

audioSettle(function () {
  startHint.el.textContent = '▶ 撳一下開始播放（廣東話旁白）';
});

/* ============================================================

var t = 0, playing = false, ffEnd = -1, ffKeep = true;
var lastUserScroll = -1e9, curStepIdx = -1;
function stepIndexAt(tt) {
  var i = TL.length - 1;
  while (i > 0 && tt < TL[i].t0) i--;
  return i;
}
/* v7.6 防窒（Claude 外審）：正常播放只行「上格→而家」嘅步；倒退／大跳步先全行（←退回/重播照用全行，撤銷保證唔變） */
var lastApplyIdx = -1, lastApplyTT = -1;

  var i, s, p;
  /* v6（Claude 一行修正）：全行先由後向前 reset 將來步驟，再順序行 0..idx——跳轉＝播放畫面 */
  if (full) { for (i = TL.length - 1; i > idx; i--) TL[i].fn(0); }
  for (i = from; i <= to; i++) {
    s = TL[i]; p = (tt - s.t0) / s.dur;
    s.fn(p <= 0 ? 0 : (p >= 1 ? 1 : p));

  if (idx !== curStepIdx) { curStepIdx = idx; lastUserScroll = -1e9; }
}
function maxScroll() { return Math.max(0, CFG.world.H - H / K + 30); }

  var vh = H / K;
  if (performance.now() - lastUserScroll > 2200) {

       （筆尖離可視底邊唔夠 120）先至 scroll down；平時上下輕微郁動，畫面企定免頭暈。
       唔會自動向上滚；⏮／重播／S 鍵會將 scrollY 歸零。 */
    var edge = 120;
    var target = scrollY;
    if (pen.visible && pen.position.y > scrollY + vh - edge)
      target = clamp(pen.position.y - vh + edge, 0, maxScroll());
    scrollY += (target - scrollY) * Math.min(1, dt * 4.2);
    if (Math.abs(target - scrollY) < 0.4) scrollY = target;
  }

  camera.top = scrollY; camera.bottom = scrollY + vh;
  camera.updateProjectionMatrix();
}
var lastHintStr = '';
function flushHud() {
  syncPlayIcon();

  for (i = 0; i < hudItems.length; i++) {
    it = hudItems[i];

      (it.anchor === 'c' ? ' translate(-50%,-50%)' : '');

  }
  for (j = 0; j < badges.length; j++) {
    b = badges[j];
    op = (b.p <= 0) ? 0 : Math.min(1, b.p * 3) * (1 - clamp((t - (b.tFade || 1e9)) / 0.6, 0, 1));
    if (b.lo !== op) { b.lo = op; b.el.style.opacity = op; }
    if (b.p <= 0) continue;
    tf = 'translate(' + ((b.x + OX) * K).toFixed(1) + 'px,' + ((b.y - scrollY) * K).toFixed(1) + 'px)' +
      ' translate(-50%,-50%) scale(' + (0.4 + 0.6 * backOut(Math.min(1, b.p))).toFixed(3) + ')';
    if (b.tf !== tf) { b.tf = tf; b.el.style.transform = tf; }
  }
  for (k = 0; k < slotEls.length; k++) {
    se = slotEls[k];
    if (se.lo !== se.p) { se.lo = se.p; se.it.el.style.opacity = se.p; }
    tf = 'translate(' + ((se.it.x + OX) * K).toFixed(1) + 'px,' + ((se.it.y - scrollY) * K).toFixed(1) + 'px)' +
      (se.it.anchor === 'c' ? ' translate(-50%,-50%)' : '') +
      ' scale(' + (0.3 + 0.7 * Math.min(1, se.p)).toFixed(3) + ')';
    if (se.tf !== tf) { se.tf = tf; se.it.el.style.transform = tf; }
  }
  var hint = audioBlocked ? '🔊 撳一下畫面開聲'
    : (READY && t < 0.05 && !playing) ? '▶ 撳一下開始播放（廣東話旁白）' : '';
  if (hint && hint !== lastHintStr) { lastHintStr = hint; startHint.el.textContent = hint; }
  op = ((t < 0.05 && !playing) || audioBlocked) ? 1 : 0;
  if (startHint.lo !== op) { startHint.lo = op; startHint.el.style.opacity = op; }
}
var lastNarrStr = '', lastMiniStr = '';
function flushPanel() {
  var s = NARRSTATE.text.slice(0, NARRSTATE.len);
  if (s !== lastNarrStr) { lastNarrStr = s; narrEl.textContent = s; }
  var mini = '', i, tk, op, tf;
  for (i = 0; i < TOK.length; i++) {
    tk = TOK[i];
    if (tk.lo !== tk.p) { tk.lo = tk.p; tk.el.style.opacity = tk.p; }
    tf = 'scale(' + (0.4 + 0.6 * Math.min(1, tk.p)).toFixed(3) + ')';
    if (tk.tf !== tf) { tk.tf = tf; tk.el.style.transform = tf; }
    if (tk.p > 0.05) mini = tk.txt;
  }
  if (mini !== lastMiniStr) { lastMiniStr = mini; miniEl.textContent = mini || '　'; }
  for (var j = 0; j < phaseEls.length; j++) {
    var cls = 'ph' + (j < CUR_PHASE ? ' done' : j === CUR_PHASE ? ' active' : '');
    if (phaseEls[j].className !== cls) {

var btnPlayEl = document.getElementById('btnPlay');
var lastPlayIcon = '';
/* v3：播放掣圖示同步——播放中即刻變 ⏸（使用者指示：暫停掣唔可以仲係 play 制） */
function syncPlayIcon() {
  var ic = playing ? '⏸' : '▶';
  if (ic !== lastPlayIcon) { lastPlayIcon = ic; btnPlayEl.textContent = ic;
    btnPlayEl.title = playing ? '暫停' : '播放'; }
}
var lastNow = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  try { /* v7.3：任何錯誤唔准殺死動畫迴圈 */
  var dt = Math.min(0.25, (now - lastNow) / 1000); lastNow = now;
  if (ffEnd >= 0) {
    t = Math.min(ffEnd, t + dt * 10);
    if (t >= ffEnd - 1e-6) { t = ffEnd; ffEnd = -1; playing = ffKeep; }
  } else if (playing) {
    /* v7.6 防窒（Claude 外審）：聲仲緊衝（readyState<3）→ 畫面企定等聲，唔准冇聲獨行 */
    var segAud = (READY && ffEnd < 0 && curSeg >= 0 && ASTEPS[curSeg] && AUDIOS[ASTEPS[curSeg].a]) ? AUDIOS[ASTEPS[curSeg].a] : null;
    var stalled = segAud && !segAud.paused && segAud.readyState < 3;
    if (!stalled) t = Math.min(TOTAL, t + dt);
    /* v7.3：聲音做主，動畫追聲（使用者指示）：聲超前動畫 >0.3s → 每 frame 最多 +50% 加速追 */
    if (segAud && !segAud.paused && !stalled) {
      var lagAud = segAud.currentTime - (t - ASTEPS[curSeg].t0);
      if (lagAud > 0.3) t = Math.min(TOTAL, t + Math.min(lagAud - 0.3, dt * 0.5));
    }
    if (t >= TOTAL) playing = false;
  }
  applyAll(t);
  if (READY) syncAudio();
  updateScroll(dt);
  renderer.render(scene, camera);
  flushHud();
  flushPanel();
  } catch (errFrame) { if (window.console && console.error) console.error('frame', errFrame); }
}
addEventListener('keydown', function (e) {
  if (!READY) return;
  if (e.code === 'Space') {
    e.preventDefault();
    if (!playing && t >= TOTAL) t = 0;
    playing = !playing; ffEnd = -1; lastUserScroll = -1e9; unlockAudio(); kickAudioInGesture();
  } else if (e.code === 'KeyS' || e.code === 'Escape') {
    t = 0; playing = false; ffEnd = -1; scrollY = 0; lastUserScroll = -1e9;
  } else if (e.code === 'ArrowRight') {
    e.preventDefault();
    if (t >= TOTAL) return;
    var i = stepIndexAt(t), end = TL[i].t0 + TL[i].dur;
    if (t >= end - 1e-6 && i < TL.length - 1) end = TL[i + 1].t0 + TL[i + 1].dur;
    ffEnd = end; ffKeep = playing; playing = true; lastUserScroll = -1e9;
  } else if (e.code === 'ArrowLeft') {
    e.preventDefault();
    var j = stepIndexAt(t), target = TL[j].t0;
    if (t - TL[j].t0 < 0.04 && j > 0) target = TL[j - 1].t0;
    t = target; playing = false; ffEnd = -1; lastUserScroll = -1e9;
  }
});
document.getElementById('replay').addEventListener('click', function (e) {
  if (!READY) return;
  t = 0; playing = true; ffEnd = -1; scrollY = 0; lastUserScroll = -1e9; unlockAudio(); kickAudioInGesture();
  e.currentTarget.blur();
});
/* 螢幕掣 ⏮ ▶ ⏭（A4：iPad 冇 keyboard）＋🔊 靜音掣（課室投影） */
document.getElementById('btnPlay').addEventListener('click', function (e) {
  if (!READY) return;
  if (!TL.length) { try { startHint.el.textContent = '⚠️ 動畫初始化失敗，請重新載入呢個檔案'; startHint.el.style.opacity = 1; } catch (eg) {} return; }
  if (!playing && t >= TOTAL) t = 0;
  playing = !playing; ffEnd = -1; lastUserScroll = -1e9; unlockAudio(); kickAudioInGesture();
  e.currentTarget.blur();
});
document.getElementById('btnPrev').addEventListener('click', function (e) {
  if (!READY) return;
  var j = stepIndexAt(t), target = TL[j].t0;
  if (t - TL[j].t0 < 0.04 && j > 0) target = TL[j - 1].t0;
  t = target; playing = false; ffEnd = -1; lastUserScroll = -1e9;
  e.currentTarget.blur();
});
document.getElementById('btnNext').addEventListener('click', function (e) {
  if (!READY) return;
  if (t >= TOTAL) return;
  var i = stepIndexAt(t), end = TL[i].t0 + TL[i].dur;
  if (t >= end - 1e-6 && i < TL.length - 1) end = TL[i + 1].t0 + TL[i + 1].dur;
  ffEnd = end; ffKeep = playing; playing = true; lastUserScroll = -1e9;
  e.currentTarget.blur();
});
var muteBtn = document.getElementById('muteBtn');
muteBtn.addEventListener('click', function (e) {
  muted = !muted;

document.getElementById('stage').addEventListener('wheel', function (e) {
  e.preventDefault();
  scrollY = clamp(scrollY + e.deltaY / K, 0, maxScroll());
  lastUserScroll = performance.now();
}, { passive: false });
(function () {
  var ty = null, tapMoved = false;
  var st = document.getElementById('stage');
  st.addEventListener('touchstart', function (e) { ty = e.touches[0].clientY; }, { passive: true });
  st.addEventListener('touchmove', function (e) {
    var y = e.touches[0].clientY;
    if (ty != null) {
      scrollY = clamp(scrollY + (ty - y) / K, 0, maxScroll());
      lastUserScroll = performance.now();
    }
    ty = y;
  }, { passive: true });
  st.addEventListener('touchmove', function () { tapMoved = true; }, { passive: true });
  /* iPad／觸控：點按畫面＝播放／暫停 */
  st.addEventListener('click', function () {
    if (tapMoved) { tapMoved = false; return; }
    if (!READY) return;
    if (!TL.length) { try { startHint.el.textContent = '⚠️ 動畫初始化失敗，請重新載入呢個檔案'; startHint.el.style.opacity = 1; } catch (eg2) {} return; }
    if (!playing && t >= TOTAL) t = 0;

  });
})();
/* v8 診斷（網址加 ?debug=1 先開）：iPad 冇 Console——左下角顯示音頻狀態：
   TTS 段旗／blob 攞到冇／readyState／networkState／seek 次數（Claude 外審建議） */
(function () {

  document.body.appendChild(dbg);

    var arr = function (m) { var s = '', i; for (i = 0; i < m.length; i++) s += m[i] ? '1' : '0'; return s; };
    dbg.textContent = 'READY:' + (READY ? 1 : 0) + ' net:' + (useNetFetch() ? 1 : 0) +

      ' ahead:' + (waOn() ? Math.max(0, nextFree - AC.currentTime).toFixed(1) : '-') +
      (a ? '\nrs:' + a.readyState + ' ns:' + a.networkState + ' paused:' + a.paused +
        ' ct:' + a.currentTime.toFixed(2) +

/* ============================================================
   §11  自適應

function resize() {
