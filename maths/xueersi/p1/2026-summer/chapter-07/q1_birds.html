  slotStep(4, S.slot + 0.15);
  calcStep([3, 4], S.calc);
  /* Phase 4 驗證右圖 → 寫答案「8」 */
  narrAudio(NARR.p4, 3, 4);
  regionStep(rg.pondR, S.region);
  CFG.swansR.forEach(function (a, i) {
    var b = makeBadge(i + 1, pond2.x + a[0], pond2.y + a[1] - 44, CFG.colors.region[2]);
    countStep(actors.swansR[i], pond2.x + a[0], pond2.y + a[1] - 24, b, 28, S.countFast);
  });
  slotStep(5, S.slotAns);
  calcStep([5, 6], S.calc + 0.2);
  /* Phase 5 圈選項 B → 慶祝 */
  narrAudio(NARR.p5, 4, 5);
  var cDur = 3.2, eDur = Math.max(2.5, audDur(6) - cDur), T6 = TACC;
  (function () {
    var from = toPen(circPts[0][0], circPts[0][1]);
    step(cDur, function (p) {
      if (p <= 0) { setLine(circleLine, 0); circleLine.material.opacity = 1; return; }
      var lp = Math.min(1, p / 0.94);
      setLine(circleLine, lp);
      var pt = pathAt(circPts, lp);
      pen.position.set(pt[0], pt[1], 60);
      circleLine.material.opacity = p > 0.96 ? 0.85 : 1;
    });
  })();
  (function () {
    var from = toPen(490, 860);
    step(eDur, function (p) {
      if (p <= 0) { celEl.el.style.opacity = 0; cheerEl.style.opacity = 0; confettiUpdate(0); return; }
      celEl.el.style.opacity = Math.min(1, p * 2.5);
      cheerEl.style.opacity = clamp((p - 0.1) * 2, 0, 1);
      confettiUpdate(p);
      NARRSTATE.text = NARR.end;
      NARRSTATE.len = Math.floor(clamp(p / 0.6, 0, 1) * (NARR.end.length + 2));
      pen.position.set(490 + Math.sin(p * 9) * 26, 862 + Math.cos(p * 7) * 10, 60);
    });
  })();
  AUDIO_STEPS.push({ el: AUDIOS[6], T0: T6, T1: TACC });   /* 07.mp3 跨圈選＋慶祝兩步 */
})();
TOTAL = TACC;
READY = true;
});   /* end whenAudioReady */
/* ============================================================
   §10  播放引擎 + 控制
   ============================================================ */
var t = 0, playing = false, ffEnd = -1, ffKeep = true;

/* 語音同步（宣告式）：由 t / playing / ffEnd 推算每段 MP3 應有狀態——
   暫停=pause 保留進度；←退回/重置=歸零；快進=靜音跳過；resume 自動 seek 返正確位 */
function syncAudio() {
  for (var i = 0; i < AUDIO_STEPS.length; i++) {
    var s = AUDIO_STEPS[i], a = s.el;
    var want = READY && playing && ffEnd < 0 && t >= s.T0 && t < s.T1;
    if (want) {
      var off = t - s.T0, d = a.duration;
      /* bug#3 guard：MP3 ended 後 0.45s 緩衝期內唔准 re-play 尾段（殘留怪聲）*/
      if (a.paused && !(isFinite(d) && off >= d - 0.06)) {
        try { a.currentTime = Math.max(0, off); a.play().catch(function () {}); } catch (err) {}
      }
    } else if (!a.paused) { a.pause(); }
    if ((t < s.T0 - 0.01 || t >= s.T1) && a.currentTime > 0) { try { a.currentTime = 0; } catch (err) {} }
  }
}
var lastUserScroll = -1e9, curStepIdx = -1;
function stepIndexAt(tt) {
  var i = TL.length - 1;
  while (i > 0 && tt < TL[i].t0) i--;
  return i;
}
function applyAll(tt) {
  for (var i = 0; i < TL.length; i++) {
    var s = TL[i], p = (tt - s.t0) / s.dur;
    s.fn(p <= 0 ? 0 : (p >= 1 ? 1 : p));
  }
  var idx = stepIndexAt(tt);
  if (idx !== curStepIdx) { curStepIdx = idx; lastUserScroll = -1e9; }
}
function maxScroll() { return Math.max(0, CFG.world.H - H / K + 30); }
function updateScroll(dt) {
  var vh = H / K;
  if (performance.now() - lastUserScroll > 2200) {
    var target = clamp(pen.position.y - vh * 0.45, 0, maxScroll());
    scrollY += (target - scrollY) * Math.min(1, dt * 4.2);
    if (Math.abs(target - scrollY) < 0.4) scrollY = target;
  }
  camera.left = -OX; camera.right = CFG.world.W + OX;
  camera.top = scrollY; camera.bottom = scrollY + vh;
  camera.updateProjectionMatrix();
}
function flushHud() {
  for (var i = 0; i < hudItems.length; i++) {
    var it = hudItems[i];
    var sx = (it.x + OX) * K, sy = (it.y - scrollY) * K;
    it.el.style.transform = 'translate(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px)' +
      (it.anchor === 'c' ? ' translate(-50%,-50%)' : '');
  }
  for (var j = 0; j < badges.length; j++) {
    var b = badges[j];
    if (b.p <= 0) { b.el.style.opacity = 0; continue; }
    var bx = (b.x + OX) * K, by = (b.y - scrollY) * K;
    var sc = 0.4 + 0.6 * backOut(Math.min(1, b.p));
    var fadeP = 1 - clamp((t - (b.tFade || 1e9)) / 0.6, 0, 1); b.el.style.opacity = Math.min(1, b.p * 3) * fadeP;
    b.el.style.transform = 'translate(' + bx.toFixed(1) + 'px,' + by.toFixed(1) + 'px)' +
      ' translate(-50%,-50%) scale(' + sc.toFixed(3) + ')';
  }
  for (var k = 0; k < slotEls.length; k++) {
    var se = slotEls[k];
    se.it.el.style.opacity = se.p;
    se.it.el.style.transform = se.it.el.style.transform.replace(/ scale\([0-9.]+\)$/, '') +
      ' scale(' + (0.3 + 0.7 * Math.min(1, se.p)).toFixed(3) + ')';
  }
  startHint.el.style.opacity = (t < 0.05 && !playing) ? 1 : 0;
}
function flushPanel() {
  narrEl.textContent = NARRSTATE.text.slice(0, NARRSTATE.len);
  var mini = '';
  for (var i = 0; i < TOK.length; i++) {
    var tk = TOK[i];
    tk.el.style.opacity = tk.p;
    tk.el.style.transform = 'scale(' + (0.4 + 0.6 * Math.min(1, tk.p)).toFixed(3) + ')';
    if (tk.p > 0.05) mini = tk.txt;
  }
  miniEl.textContent = mini || '　';
  for (var j = 0; j < phaseEls.length; j++) {
    var cls = 'ph' + (j < CUR_PHASE ? ' done' : j === CUR_PHASE ? ' active' : '');
    if (phaseEls[j].className !== cls) {
      phaseEls[j].className = cls;
      if (cls.indexOf('active') >= 0) { void phaseEls[j].offsetWidth; }
    }
  }
}
var lastNow = performance.now();
function frame(now) {
  var dt = Math.min(0.05, (now - lastNow) / 1000); lastNow = now;
  if (ffEnd >= 0) {
    t = Math.min(ffEnd, t + dt * 10);
    if (t >= ffEnd - 1e-6) { t = ffEnd; ffEnd = -1; playing = ffKeep; }
  } else if (playing) {
    t = Math.min(TOTAL, t + dt);
    if (t >= TOTAL) playing = false;
  }
  applyAll(t);
  syncAudio();
  updateScroll(dt);
  renderer.render(scene, camera);
  flushHud();
  flushPanel();
  requestAnimationFrame(frame);
}
addEventListener('keydown', function (e) {
  if (!READY) return;
  if (e.code === 'Space') {
    e.preventDefault();
    if (!playing && t >= TOTAL) t = 0;
    playing = !playing; ffEnd = -1; lastUserScroll = -1e9;
  } else if (e.code === 'KeyS' || e.code === 'Escape') {
    t = 0; playing = false; ffEnd = -1; scrollY = 0; lastUserScroll = -1e9;
  } else if (e.code === 'ArrowRight') {
    e.preventDefault();
    if (t >= TOTAL) return;
    var i = stepIndexAt(t), end = TL[i].t0 + TL[i].dur;
    if (t >= end - 1e-6 && i < TL.length - 1) end = TL[i + 1].t0 + TL[i + 1].dur;
    ffEnd = end; ffKeep = playing; playing = true; lastUserScroll = -1e9;
  } else if (e.code === 'ArrowLeft') {
    e.preventDefault();
    var j = stepIndexAt(t), target = TL[j].t0;
    if (t - TL[j].t0 < 0.04 && j > 0) target = TL[j - 1].t0;
    t = target; playing = false; ffEnd = -1; lastUserScroll = -1e9;
  }
});
document.getElementById('replay').addEventListener('click', function (e) {
  if (!READY) return;
  t = 0; playing = true; ffEnd = -1; scrollY = 0; lastUserScroll = -1e9;
  e.currentTarget.blur();
});
var muteBtn = document.getElementById('muteBtn');
muteBtn.addEventListener('click', function () {
  var m = !AUDIOS[0].muted;
  AUDIOS.forEach(function (a) { a.muted = m; });
  muteBtn.textContent = m ? '🔇' : '🔊';
  muteBtn.blur();
});
document.getElementById('stage').addEventListener('wheel', function (e) {
  e.preventDefault();
  scrollY = clamp(scrollY + e.deltaY / K, 0, maxScroll());
  lastUserScroll = performance.now();
}, { passive: false });
(function () {
  var ty = null;
  var st = document.getElementById('stage');
  st.addEventListener('touchstart', function (e) { ty = e.touches[0].clientY; }, { passive: true });
  st.addEventListener('touchmove', function (e) {
    var y = e.touches[0].clientY;
    if (ty != null) {
      scrollY = clamp(scrollY + (ty - y) / K, 0, maxScroll());
      lastUserScroll = performance.now();
    }
    ty = y;
  }, { passive: true });
})();
/* ============================================================
   §11  自適應
   ============================================================ */
function resize() {
  W = innerWidth; H = innerHeight;
  VIEWW = Math.min(1860, Math.max(1020, (W / H) * 930));
  OX = (VIEWW - CFG.world.W) / 2;
  K = W / VIEWW;
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.setSize(W, H, false);
  panel.classList.toggle('mobile', W < 900);
  for (var i = 0; i < hudItems.length; i++) {
    var it = hudItems[i];
    it.el.style.fontSize = Math.max(it.min, it.size * K).toFixed(1) + 'px';
  }
  for (var j = 0; j < badges.length; j++) {
    badges[j].el.style.fontSize = Math.max(16, 22 * K).toFixed(1) + 'px';
  }
}
addEventListener('resize', resize);

/* ---------- iPad／觸控支援（iOS 音頻解鎖＋點按畫面＝播放／暫停）---------- */
(function () {
  function unlockAudio() {
    AUDIOS.forEach(function (a) {
      var m = a.muted; a.muted = true;
      var pr = a.play();
      var fin = function () { try { a.pause(); a.currentTime = 0; } catch (e) {} a.muted = m; };
      if (pr && pr.then) pr.then(fin).catch(function () { a.muted = m; }); else fin();
    });
    removeEventListener('pointerdown', unlockAudio);
    removeEventListener('touchstart', unlockAudio);
    removeEventListener('keydown', unlockAudio);
  }
  addEventListener('pointerdown', unlockAudio);
  addEventListener('touchstart', unlockAudio);
  addEventListener('keydown', unlockAudio);
  var tapMoved = false;
  document.getElementById('stage').addEventListener('touchmove', function () { tapMoved = true; }, { passive: true });
  document.getElementById('stage').addEventListener('click', function () {
    if (tapMoved) { tapMoved = false; return; }
    if (!READY) return;
    if (!playing && t >= TOTAL) t = 0;
    playing = !playing; ffEnd = -1; lastUserScroll = -1e9;
  });
})();
resize();
requestAnimationFrame(frame);
</script>
